<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mineur Témoin 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#02040a;color:white;font-family:Arial}#ui{position:fixed;z-index:2;left:16px;top:16px;background:#08101dcc;border:1px solid #ffd85a55;border-radius:14px;padding:14px}#buttons{position:fixed;z-index:2;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px}button{padding:11px 15px;border-radius:12px;border:1px solid #ffffff22;background:#08101ddd;color:white;font-weight:700}button:hover{border-color:#ffd85a;color:#ffd85a}</style></head><body><div id="ui"><b>MT — MINEUR TÉMOIN</b><div id="state">Marche active</div></div><div id="buttons"><button id="walk">Marche</button><button id="stop">Arrêt</button><button id="front">Face</button><button id="side">Profil</button><button id="back">Dos</button></div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.166.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.166.1/examples/jsm/"}}</script><script type="module">import * as T from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';const r=new T.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(r.domElement);const s=new T.Scene();s.background=new T.Color(0x02040a);const c=new T.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);c.position.set(6,3,8);const o=new OrbitControls(c,r.domElement);o.target.set(0,1.8,0);o.enableDamping=true;s.add(new T.HemisphereLight(0x9ccfff,0x160a00,1.8));const d=new T.DirectionalLight(0xffdf8c,4);d.position.set(4,7,5);s.add(d);const p=new T.PointLight(0xffb000,20,12);p.position.set(-3,3,-3);s.add(p);const floor=new T.Mesh(new T.CircleGeometry(8,96),new T.MeshStandardMaterial({color:0x080d16,roughness:.9}));floor.rotation.x=-Math.PI/2;s.add(floor);const ring=new T.Mesh(new T.RingGeometry(1.6,1.63,96),new T.MeshBasicMaterial({color:0xffd85a,transparent:true,opacity:.4,side:T.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.y=.01;s.add(ring);const gold=new T.MeshStandardMaterial({color:0xd99b14,metalness:.75,roughness:.22,emissive:0x5a2b00,emissiveIntensity:.7}),bright=new T.MeshStandardMaterial({color:0xffdf6a,metalness:.85,roughness:.15,emissive:0x7a4200,emissiveIntensity:1}),dark=new T.MeshStandardMaterial({color:0x11141b,metalness:.5});function m(g,mat,parent,x=0,y=0,z=0){const q=new T.Mesh(g,mat);q.position.set(x,y,z);parent.add(q);return q}const root=new T.Group();s.add(root);const pelvis=new T.Group();pelvis.position.y=1.6;root.add(pelvis);const hip=m(new T.SphereGeometry(.3,24,18),gold,pelvis);hip.scale.set(1.2,.7,.85);const torso=new T.Group();torso.position.y=.45;pelvis.add(torso);const chest=m(new T.CapsuleGeometry(.44,.7,8,18),gold,torso,0,.2,0);chest.scale.set(1.25,1.1,.75);m(new T.CylinderGeometry(.18,.18,.05,32),bright,torso,0,.28,.37).rotation.x=Math.PI/2;const head=new T.Group();head.position.set(0,1.18,0);torso.add(head);m(new T.SphereGeometry(.25,28,22),bright,head);m(new T.BoxGeometry(.38,.12,.08),dark,head,0,.02,.22);function arm(side){const a=new T.Group();a.position.set(.54*side,.58,0);torso.add(a);m(new T.SphereGeometry(.18,20,16),bright,a);const u=new T.Group();u.position.y=-.17;a.add(u);m(new T.CapsuleGeometry(.115,.46,8,14),gold,u,0,-.23,0);const e=new T.Group();e.position.y=-.5;u.add(e);m(new T.SphereGeometry(.12,18,14),bright,e);const f=new T.Group();f.position.y=-.1;e.add(f);m(new T.CapsuleGeometry(.095,.4,8,14),gold,f,0,-.2,0);return{a,e}}function leg(side){const h=new T.Group();h.position.set(.2*side,-.1,0);pelvis.add(h);m(new T.SphereGeometry(.17,20,14),bright,h);const t=new T.Group();t.position.y=-.15;h.add(t);m(new T.CapsuleGeometry(.145,.56,8,16),gold,t,0,-.28,0);const k=new T.Group();k.position.y=-.61;t.add(k);m(new T.SphereGeometry(.14,18,14),bright,k);const sh=new T.Group();sh.position.y=-.12;k.add(sh);m(new T.CapsuleGeometry(.12,.56,8,16),gold,sh,0,-.28,0);m(new T.BoxGeometry(.24,.18,.46),bright,sh,0,-.66,.12);return{h,k}}const la=arm(-1),ra=arm(1),ll=leg(-1),rl=leg(1);let walking=true;const clock=new T.Clock();function view(x,y,z){c.position.set(x,y,z);o.target.set(0,1.8,0);o.update()}walk.onclick=()=>{walking=true;state.textContent='Marche active'};stop.onclick=()=>{walking=false;state.textContent='Immobile'};front.onclick=()=>view(0,3,7);side.onclick=()=>view(7,3,0);back.onclick=()=>view(0,3,-7);function loop(){requestAnimationFrame(loop);const t=clock.getElapsedTime(),b=walking?1:0,w=Math.sin(t*4.5)*.72*b;ll.h.rotation.x=w;rl.h.rotation.x=-w;ll.k.rotation.x=Math.max(0,-Math.sin(t*4.5))*.75*b;rl.k.rotation.x=Math.max(0,Math.sin(t*4.5))*.75*b;la.a.rotation.x=-w*.7;ra.a.rotation.x=w*.7;pelvis.position.y=1.6+Math.abs(Math.sin(t*4.5))*.045*b;torso.rotation.z=Math.sin(t*4.5)*.035*b;ring.rotation.z=t*.08;o.update();r.render(s,c)}loop();addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)})</script></body></html>
